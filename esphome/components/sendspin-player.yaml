---
# Sendspin receiver: hub + media source + media players + metadata entities.
# Expects the speaker pipeline ids from components/pcm5102a.yaml
# (media_resampling_speaker, announcement_resampling_speaker) and the
# `user_led` output from devices/xiao-esp32-s3.yaml.
# Uses the native ESPHome sendspin components (ESPHome 2026.5+, experimental).
# Requires substitution: media_sample_rate.
sendspin:
  id: sendspin_hub
  on_pairing_failed:
    - logger.log:
        format: "Sendspin pairing failed: %s"
        args: ["reason.c_str()"]
        level: WARN

media_source:
  - platform: audio_http
    id: http_announcement_source
  - platform: audio_http
    id: http_media_source
  - platform: sendspin
    id: sendspin_media_source
    buffer_size: 500000

media_player:
  # Group-wide transport/volume control (does not output audio itself).
  - platform: sendspin
    id: sendspin_group_media_player
    name: Group Media Player

  # This device's own player: receives the Sendspin group stream and
  # any HTTP announcements.
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: ${media_sample_rate}
      speaker: announcement_resampling_speaker
      sources:
        - http_announcement_source
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: ${media_sample_rate}
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.9
    on_state:
      then:
        - if:
            condition:
              lambda: |-
                using media_player::MediaPlayerState;
                auto state = id(external_media_player).state;
                return state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ||
                       state == MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING;
            then:
              - script.execute: led_play_indicator
            else:
              - script.stop: led_play_indicator
              - output.turn_off: user_led

script:
  # Slow blink on the user LED while audio is playing.
  - id: led_play_indicator
    mode: single
    then:
      - while:
          condition:
            lambda: |-
              using media_player::MediaPlayerState;
              auto state = id(external_media_player).state;
              return state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ||
                     state == MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING;
          then:
            - output.turn_on: user_led
            - delay: 300ms
            - output.turn_off: user_led
            - delay: 2700ms

switch:
  # Manual offset for speaker-distance compensation.
  - platform: template
    id: sendspin_delay_adjustable
    name: Adjustable Delay
    icon: mdi:speaker-wireless
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - sendspin.media_source.enable_static_delay_adjustment:
    turn_off_action:
      - sendspin.media_source.disable_static_delay_adjustment:

  - platform: sendspin
    id: sendspin_unpaired_access
    type: unpaired_access
    name: Unpaired Access
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON

button:
  - platform: template
    id: sendspin_confirm_pairing
    name: Confirm Pairing
    icon: mdi:link-variant
    entity_category: config
    on_press:
      - sendspin.confirm_pairing_window: sendspin_hub

text_sensor:
  - platform: sendspin
    id: sendspin_title
    name: Song Title
    type: title
  - platform: sendspin
    id: sendspin_artist
    name: Song Artist
    type: artist
  - platform: sendspin
    id: sendspin_album
    name: Album Name
    type: album
  - platform: sendspin
    id: sendspin_pairing_code
    type: pairing_code
    name: Pairing Code
